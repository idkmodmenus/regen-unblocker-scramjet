  <canvas id="bg-canvas"></canvas>

    <img class="cloud-logo" src="Lunar-proxy.png" alt="Lunar Proxy" />
    <h1 class="cloud-title"><span class="cloud-title-accent">Lunar</span> Cloud</h1>
    <section class="games-grid" id="games-grid" aria-label="Games"></section>
  </main>

  <div class="iframe-overlay" id="iframe-overlay" aria-hidden="true">
    <button class="close-frame" id="close-frame" type="button" aria-label="Close game">&times;</button>
    <iframe class="game-frame" id="game-frame" title="Game player" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.fog.min.js"></script>
  <script>
    if (window.VANTA && typeof window.VANTA.FOG === 'function') {
      VANTA.FOG({
        el: '#vanta',
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200,
        minWidth: 200,
        highlightColor: 0x4b7890,
        midtoneColor: 0x263d49,
        lowlightColor: 0x122027,
        baseColor: 0x04090c,
        blurFactor: 0.7,
        speed: 0.8,
        zoom: 0.85
      });
    }

    (() => {
      const canvas = document.getElementById('stars');
      const context = canvas.getContext('2d');
      const stars = [];
      let width = 0;
      let height = 0;

      function resizeStars() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      function seedStars() {
        stars.length = 0;
        const count = Math.min(72, Math.max(34, Math.floor((width * height) / 26000)));
        for (let index = 0; index < count; index += 1) {
          stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 0.65 + 0.35,
            speed: Math.random() * 0.18 + 0.06,
            opacity: Math.random() * 0.18 + 0.1,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      function drawStars(time) {
        context.clearRect(0, 0, width, height);
        stars.forEach((star) => {
          star.y -= star.speed;
          if (star.y < -star.radius) star.y = height + star.radius;
          const shimmer = star.opacity + Math.sin(time * 0.0007 + star.phase) * 0.04;
          context.beginPath();
          context.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
          context.fillStyle = `rgba(210, 190, 255, ${Math.max(0.04, shimmer)})`;
          context.fill();
        });
        requestAnimationFrame(drawStars);
      }

      resizeStars();
      seedStars();
      window.addEventListener('resize', () => {
        resizeStars();
        seedStars();
      });
      requestAnimationFrame(drawStars);
    })();

    const proxyBase = 'https://camp-doe-heroes-accent.trycloudflare.com/ixl/';

    function buildProxyUrl(targetUrl) {
      return `${proxyBase}${encodeURIComponent(targetUrl)}`;
    }

    const games = [
      {
        name: 'Roblox',
        url: 'https://nowgg.fun/apps/a/19900/b.html',
        cardClass: 'roblox-card',
        logo: '<svg class="roblox-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="m7.1 3.6 13.3 3.1-3.1 13.3L4 16.9 7.1 3.6Z" fill="currentColor" stroke="none"/><path d="m10.1 8.5 5.4 1.3-1.3 5.4-5.4-1.3 1.3-5.4Z" fill="#171923" stroke="none"/></svg>'
      },
      {
        name: 'Android VM',
        url: 'https://nowgg.fun/apps/uncube/7074/now.html',
        cardClass: 'android-card',
        logo: '<svg class="android-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10.5h10v6.2a1.8 1.8 0 0 1-1.8 1.8H8.8A1.8 1.8 0 0 1 7 16.7v-6.2Z" fill="currentColor" stroke="none"/><path d="m8.2 9.8 1.6-2.6m6 2.6-1.6-2.6M5.3 11.2v4.5m13.4-4.5v4.5M10 18.5v2m4-2v2"/><path d="M9.4 10.5h5.2"/></svg>'
      },
      {
        name: 'Geometry Dash',
        url: 'https://nowgg.fun/apps/robtop-games/1400/geometry-dash.html',
        cardClass: 'geometry-card',
        logo: '<svg class="geometry-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5z" fill="currentColor" stroke="none"/><path d="m8 8 3 3 3-3m-6 8 3-3 3 3" stroke="#211b0b" stroke-width="1.8"/><path d="M8.5 12h7" stroke="#211b0b" stroke-width="1.8"/></svg>'
      }
    ];

    const gamesGrid = document.getElementById('games-grid');
    gamesGrid.innerHTML = games.map((game) => `
      <button class="game-card ${game.cardClass}" type="button" data-url="${game.url}">
        <span class="game-info">
          <span class="game-logo">${game.logo}</span>
          <span class="game-title">${game.name}</span>
          <span class="game-action">Launch game</span>
        </span>
      </button>
    `).join('');

    const iframeOverlay = document.getElementById('iframe-overlay');
    const gameFrame = document.getElementById('game-frame');
    const closeFrame = document.getElementById('close-frame');

    function closeGame() {
      iframeOverlay.classList.remove('is-open');
      iframeOverlay.setAttribute('aria-hidden', 'true');
      gameFrame.src = '';
    }

    gamesGrid.addEventListener('click', (event) => {
      const gameButton = event.target.closest('.game-card');
      if (!gameButton) return;
      gameFrame.src = buildProxyUrl(gameButton.dataset.url);
      iframeOverlay.classList.add('is-open');
      iframeOverlay.setAttribute('aria-hidden', 'false');
    });

    closeFrame.addEventListener('click', closeGame);
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeGame();
    });

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouse = { x: null, y: null, radius: 220 };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    window.addEventListener('mousemove', (event) => {
      mouse.x = event.x;
      mouse.y = event.y;
    });

    window.addEventListener('mouseout', () => {
      mouse.x = null;
      mouse.y = null;
    });

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 0.7 + 0.7;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

        if (mouse.x && mouse.y) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance > 0 && distance < mouse.radius) {
            const force = (mouse.radius - distance) / mouse.radius;
            this.x -= (dx / distance) * force * 2;
            this.y -= (dy / distance) * force * 2;
          }
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(211, 164, 255, 0.75)';
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      const count = Math.floor((canvas.width * canvas.height) / 12000);
      for (let i = 0; i < count; i++) {
        particles.push(new Particle());
      }
    }
    initParticles();
    window.addEventListener('resize', initParticles);

    function connectParticles() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 115) {
            const opacity = (1 - distance / 115) * 0.12;
            ctx.strokeStyle = `rgba(187, 134, 252, ${opacity})`;
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((particle) => {
        particle.update();
        particle.draw();
      });
      connectParticles();
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
